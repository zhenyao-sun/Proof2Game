name: Validate Proof2Game

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local document tools
        run: |
          brew install poppler pandoc
          brew install --cask basictex
          sudo /Library/TeX/texbin/tlmgr update --self
          sudo /Library/TeX/texbin/tlmgr install amsrefs geometry latexdiff latexmk mathtools
          printf '%s\n' /Library/TeX/texbin >> "$GITHUB_PATH"
      - run: python3 -m pip install "PyMuPDF>=1.24.11,<2"
      - name: Install browsers for the exported game
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-check" --no-package-lock --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/browser-check/node_modules/.bin/playwright" install chromium webkit
      - run: python3 -m unittest discover -s skills/proof2game/scripts
        env:
          PROOF2GAME_CHECK_BROWSERS: '1'
          NODE_PATH: ${{ runner.temp }}/browser-check/node_modules
      - run: node --test skills/proof2game/scripts/*.cjs
