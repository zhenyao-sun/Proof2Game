<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-KsgWelQ0GvkbH8nN5EuzRGMNi7+VG1xsZF7qI61jCuE='; style-src 'unsafe-inline'; connect-src https://dashscope.aliyuncs.com https://*.aliyuncs.com; img-src data:; form-action 'none'; base-uri 'none'"><title>Proof2Game 百炼生图实测</title><style>body{margin:28px auto;padding:0 18px;max-width:820px;font:17px/1.6 system-ui,sans-serif;color:#243e40}h1{font-size:26px}input,button{font:inherit;padding:7px 12px}input{width:min(85%,330px)}button{display:block;margin:15px 0}img{display:block;max-width:100%;height:auto}img[hidden]{display:none}#detail{font-size:15px}</style></head><body><h1>Proof2Game 百炼生图实测</h1><p>用 v0.2.0 的生图代码生成一张几何图：两个等圆外切，圆心 A、B 与切点 T 在同一直线上。</p><label for="key">百炼北京区 API Key</label><br><input type="password" id="key" autocomplete="off" spellcheck="false"><button type="button" id="run">生成一张测试图</button><p>本次点击调用一次 z-image-turbo，可能计费。Key 仅用于向百炼发送请求。</p><strong id="result" role="status">等待测试</strong><p id="detail"></p><img alt="百炼返回的几何示意图" id="pic" hidden><script type="module">export const IMAGE_MODEL = 'z-image-turbo';
export const IMAGE_ROUND_MS = 120_000;
const endpoint = 'https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation';

export async function generateBailianUrl({fetcher, key, signal, prompt}) {
  const response = await fetcher(endpoint, {
    method:'POST', credentials:'omit', redirect:'error', signal,
    headers:{'Content-Type':'application/json', Authorization:'Bearer '+key},
    body:JSON.stringify({model:IMAGE_MODEL, input:{messages:[{role:'user', content:[{text:prompt}]}]},
      parameters:{size:'1248*832', prompt_extend:false}}),
  });
  const body = await response.json().catch(()=>({}));
  if (!response.ok || body.code || body.error) {
    const code = String(body.code || body.error?.code || '');
    const invalid = response.status===401 || /InvalidApiKey|InvalidAuthentication/i.test(code);
    const balance = response.status===402 || /Arrearage|InsufficientBalance|Insufficient[_ .-]?balance|AccountOverdue/i.test(code);
    const reason = invalid ? 'invalid_key' : balance ? 'balance' : 'temporary';
    const error = new Error(invalid ? 'Bailian rejected this API key.' : balance ? 'Recharge your Bailian account and verify again.' : 'Bailian could not generate the illustration.');
    const retryAfter = response.headers?.get('retry-after');
    const delay = retryAfter==null ? 0 : /^\d+(\.\d+)?$/.test(retryAfter) ? +retryAfter*1000 : Date.parse(retryAfter)-Date.now();
    throw Object.assign(error, {provider:'bailian', status:response.status, reason, delay:Math.max(0,delay||0)});
  }
  const raw = body.output?.choices?.[0]?.message?.content?.find(part=>typeof part.image==='string')?.image;
  const url = new URL(raw);
  if (url.protocol!=='https:' || url.username || url.password || url.port ||
      !/^dashscope-[a-z0-9-]+\.oss-(?:accelerate|cn-[a-z0-9-]+)\.aliyuncs\.com$/.test(url.hostname))
    throw new Error('Unexpected Bailian image location.');
  return url.href;
}

export async function generateBailianImage(options) {
  const url = await generateBailianUrl(options);
  const response = await options.fetcher(url,{credentials:'omit',redirect:'error',referrerPolicy:'no-referrer',signal:options.signal});
  if (!response.ok) throw new Error('The generated image could not be downloaded.');
  const bytes = new Uint8Array(await response.arrayBuffer());
  // z-image-turbo supplies PNG. Never admit executable documents or a remote URL into a save.
  if (bytes.length>8*1024*1024 || bytes.length<24 || ![137,80,78,71,13,10,26,10].every((v,i)=>bytes[i]===v))
    throw new Error('Bailian returned an unsupported image.');
  let binary='';
  for (let i=0;i<bytes.length;i+=0x4000) binary+=String.fromCharCode(...bytes.subarray(i,i+0x4000));
  return 'data:image/png;base64,'+btoa(binary);
}


const input=document.querySelector('#key'), run=document.querySelector('#run'), result=document.querySelector('#result'), detail=document.querySelector('#detail'), pic=document.querySelector('#pic');
const prompt='Create a clean geometry diagram on a plain white background. Draw exactly two equal circles outlined in navy, with horizontally aligned centers, touching externally at exactly one point. Draw a thin dashed horizontal segment joining the centers. Label the left center A, the unique point of tangency T, and the right center B. Place each label slightly above its dot. Make all three dots and labels clearly visible. No coordinate axes, no other text, no decoration.';
run.addEventListener('click',async()=>{
  let key=input.value.trim();if(!key){input.focus();return;}
  input.value='';input.disabled=true;run.disabled=true;
  const start=performance.now(), clock=()=>((performance.now()-start)/1000).toFixed(1);
  const trace=[], codes=[],summary=()=>{detail.textContent=trace.join(' · ');};
  let phase='提交生图';
  const fetcher=async(url,init)=>{
    const request=new URL(url);
    const inference=init.method==='POST';
    if(inference && request.href!==endpoint)throw new Error('非预期的推理目标');
    if(!inference && init.headers)throw new Error('下载请求包含非预期的请求头');
    phase=inference?'提交生图':'下载图片';result.textContent=phase+'…';
    const response=await fetch(url,init);
    trace.push(phase+' HTTP '+response.status+'（'+clock()+' 秒）');
    if(inference){
      const body=await response.clone().json().catch(()=>({}));
      const code=body.code||body.error?.code;
      if(typeof code==='string' && /^[a-zA-Z0-9_.-]{1,60}$/.test(code))codes.push(code);
      if(body.output?.choices?.[0]?.message?.content?.some(x=>x.image))trace.push('已收到图片地址');
    }else{
      trace.push('图片类型 '+(response.headers.get('content-type')||'未知'));
    }
    summary();return response;
  };
  try{
    const src=await generateBailianImage({key,fetcher,prompt,signal:AbortSignal.timeout(120000)});
    key='';pic.src=src;await pic.decode();pic.hidden=false;
    result.textContent='出图成功';trace.push(pic.naturalWidth+' × '+pic.naturalHeight,'总耗时 '+clock()+' 秒');summary();
  }catch(e){
    key='';result.textContent='测试未完成';trace.push('阶段 '+phase,...codes,e.name+': '+e.message,'总耗时 '+clock()+' 秒');summary();
  }
});
</script></body></html>
